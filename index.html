/* Layout: full-bleed plan view; a drafting-table sidebar (desktop) or bottom sheets (phone); ficha as an archive card. */
:root{
  --land:#ECEDE8; --water:#CBD7DE; --border:#B7C0C4; --river:#A9BCC8;
  --ink:#1B2226; --muted:#5D686E; --line:#D5DAD8; --panel:#F8F8F5; --raise:#FFFFFF;

  --c-rel:#9C36B5; --c-cul:#E8590C; --c-viv:#D49A00; --c-tra:#3B8EDB; --c-ins:#0C8599;
  --c-inf:#C92A2A; --c-dep:#D6336C; --c-par:#2F9E44; --c-mem:#7A5C3E;

}

  --accent:#9DB2FF; --accent-ink:#0F1730; --warn-bg:#3A2F12; --warn-ink:#F2D58A;

  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;max-width:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;width:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}
/* top bar */
.top{position:relative;z-index:1000;display:flex;gap:10px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:17px;letter-spacing:.01em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;white-space:nowrap}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:40px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:100%}
.search svg{flex:none;color:var(--muted)}

/* ---------- filtering ---------- */
function activeCount(){const F=S.F;let n=0;if(F.country)n++;if(F.city)n++;if(F.arq)n++;if(F.periods.size)n++;if(F.from||F.to)n++;if(F.usos.size)n++;if(F.vis.size)n++;if(F.src!=='all')n++;if(F.radius)n++;if(F.outside)n++;return n}
function passes(o,skip){
  const F=S.F;
  if(!F.outside&&!o.eu)return false;
  if(skip!=='country'&&F.country&&o.country!==F.country)return false;
  if(skip!=='city'&&F.city&&o.city!==F.city)return false;
  if(F.src==='mine'&&!o.mine)return false; if(F.src==='adds'&&(o.mine||o.news))return false; if(F.src==='news'&&!o.news)return false;
  if(skip!=='uso'&&F.usos.size&&!F.usos.has(o.uso))return false;
  if(skip!=='vis'&&F.vis.size&&!F.vis.has(o.vis))return false;
  if(F.arq&&!norm(o.arq).includes(norm(F.arq)))return false;
  if(F.periods.size||F.from!==''||F.to!==''){const y=o.y0??o.y1;if(y==null)return false;
    if(F.periods.size&&!PERIODS.some(p=>F.periods.has(p[0])&&y>=p[2]&&y<=p[3]))return false;
    if(F.from!==''&&y<+F.from)return false; if(F.to!==''&&y>+F.to)return false;}
  if(F.radius&&km(F.radius.c,[o.lat,o.lon])>F.km)return false;
  if(F.q){const q=norm(F.q);if(!o._t.includes(q))return false}
  return true;
}
function apply(fit){
  const trip=S.mapTrip&&S.trips.find(t=>t.id===S.mapTrip);
  S.view=trip?trip.items.map(i=>S.byId.get(i.o)).filter(Boolean):S.obras.filter(o=>passes(o));
  $('#count').textContent=`${S.view.length} obra${S.view.length===1?'':'s'}`;
  const n=activeCount(),b=$('#fbadge');b.hidden=!n;b.textContent=n;
  cluster.clearLayers();
  if(!trip)cluster.addLayers(S.view.map(o=>S.markers.get(o.id)));
  renderTripMap();
  drawRadius();
  if(S.tab==='list'||innerWidth>=900)renderList();
  if(fit)fitView();
}
function fitView(){
  const pts=S.view.map(o=>[o.lat,o.lon]);
  if(S.F.radius&&radiusLayer){map.fitBounds(radiusLayer.getBounds(),{padding:[30,30]});return}
  if(!pts.length)return;
  if(pts.length===1){map.setView(pts[0],15);return}
  map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:15});
}
function drawRadius(){
  if(radiusLayer){map.removeLayer(radiusLayer);radiusLayer=null}
  if(S.F.radius&&!S.mapTrip){radiusLayer=L.circle(S.F.radius.c,{radius:S.F.km*1000,color:css('--accent'),weight:1.5,dashArray:'6 6',fillOpacity:.05,interactive:false}).addTo(map)}
}

const STOPW=new Set('de del la el los las y e en a al o the of and di della delle dei degli der die das den dem le les du des d l da do dos das van von zu am im st s'.split(' '));
const TYPEW=[['catedral','cathedral','cattedrale','kathedrale','cathedrale','duomo','dom','katedrala','katedra','domkirke','domkyrka'],['iglesia','church','chiesa','kirche','eglise','igreja','kirke','kyrka','kerk','kosciol','templo'],['basilica','basiliek','basilika'],['museo','museum','musee','museu','muzeum','muzej','museet'],['palacio','palace','palazzo','palast','palais','palacio','palaci','paleis','slot','schloss','castillo','castle','castello','chateau','burg'],['torre','tower','turm','tour','toren'],['puente','bridge','ponte','brucke','pont','brug'],['estacion','station','stazione','bahnhof','gare','estacao'],['biblioteca','library','bibliothek','bibliotheque','bibliotheek'],['teatro','theatre','theater','teatre','opera','auditorio','auditorium'],['casa','house','haus','maison','villa'],['monasterio','monastery','kloster','abbey','abadia','abbazia','abbaye','convento','convent'],['capilla','chapel','cappella','kapelle','chapelle'],['mezquita','mosque','moschee'],['sinagoga','synagogue','synagoge'],['ayuntamiento','town','rathaus','hotel de ville','city hall','municipio','stadhuis','raadhus','radhus'],['mercado','market','markthalle','mercato','marche'],['jardin','garden','garten','giardino','jardim','park','parque'],['plaza','square','piazza','platz','place','praca','plein']];
const TYPEMAP=new Map();TYPEW.forEach((g,i)=>g.forEach(w=>TYPEMAP.set(w,'#'+i)));
function toks(s){return norm(s).replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w&&!STOPW.has(w)&&(w.length>1||/\d/.test(w))).map(w=>TYPEMAP.get(w)||w)}
function scoreTitle(o,title){
  const t=new Set(toks([o.n,o.alt||''].join(' '))), p=new Set(toks(title));
  if(!t.size||!p.size)return 0;
  const cityT=new Set(toks(o.city||''));
  let hit=0,distinct=0;for(const w of p)if(t.has(w)){hit++;if(!w.startsWith('#')&&!cityT.has(w))distinct++}
  // The page must share at least one distinctive word (not only a type word or the city name)
  if(!distinct&&!(hit>=2&&[...t].every(w=>p.has(w))))return 0;
  const tType=[...t].filter(w=>w.startsWith('#')),pType=[...p].filter(w=>w.startsWith('#'));
  if(tType.length&&pType.length&&!tType.some(w=>p.has(w)))return 0;
  if(norm(title)===norm(o.city||''))return 0;
  return hit/(t.size+p.size-hit);
}
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').replace(/\s+/g,' ').trim()}
const AUTO_Q=new Map();
async function findAutoPhoto(o){
  const radius=o.approx?5000:1200;
  let best=null;
  for(const lang of ['es','en']){
    const u=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${o.lat}%7C${o.lon}&ggsradius=${radius}&ggslimit=30&prop=pageimages%7Ccoordinates&piprop=thumbnail%7Cname&pithumbsize=800&pilicense=free`;
    let j;try{j=await fetch(u).then(r=>r.ok?r.json():null)}catch(e){j=null}
    if(!j)continue;
    for(const p of Object.values(j.query?.pages||{})){
      if(!p.thumbnail||!p.pageimage)continue;
      const sc=scoreTitle(o,p.title);
      if(sc>=0.34&&(!best||sc>best.sc))best={sc,lang,title:p.title,file:p.pageimage,src:p.thumbnail.source};
    }
    if(best&&best.sc>=0.6)break;
  }
  if(!best)return null;
  // credit + licence from the file page
  try{
    const u=`https://${best.lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&titles=${encodeURIComponent('File:'+best.file)}&prop=imageinfo&iiprop=extmetadata%7Curl&iiextmetadatafilter=Artist%7CLicenseShortName`;
    const j=await fetch(u).then(r=>r.json());
    const ii=Object.values(j.query?.pages||{})[0]?.imageinfo?.[0];
    const m=ii?.extmetadata||{};
    const lic=stripHtml(m.LicenseShortName?.value);
    if(!lic||/fair use|non-free/i.test(lic))return null;
    return {src:best.src,a:stripHtml(m.Artist?.value).slice(0,120)||'autor en Wikimedia Commons',l:lic,u:ii.descriptionurl||`https://commons.wikimedia.org/wiki/File:${encodeURIComponent(best.file)}`,w:`https://${best.lang}.wikipedia.org/wiki/${encodeURIComponent(best.title.replace(/ /g,'_'))}`};
  }catch(e){return null}
}
function autoPhoto(o){
  const st=autoStore();
  if(o.id in st)return Promise.resolve(st[o.id]);
  if(!AUTO_Q.has(o.id))AUTO_Q.set(o.id,findAutoPhoto(o).then(r=>{st[o.id]=r||null;autoSave();AUTO_Q.delete(o.id);return r},()=>{AUTO_Q.delete(o.id);return null}));
  return AUTO_Q.get(o.id);
}

const DAYC=['--c-cul','--c-tra','--c-par','--c-rel','--c-ins','--c-dep','--c-viv','--c-inf','--c-mem'];
function dayColor(g){return css(DAYC[(g-1)%DAYC.length])}
function legKm(a,b){return km([a.lat,a.lon],[b.lat,b.lon])*1.25}
function fmtKm(d){return d<1?Math.round(d*1000/10)*10+' m':(d<10?d.toFixed(1).replace('.',','):Math.round(d))+' km'}
function fmtMin(m){m=Math.max(1,Math.round(m));return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')}
function legTxt(d){return d<=3?`${fmtKm(d)} · ${fmtMin(d/4.5*60)} a pie`:d<=40?`${fmtKm(d)} · ≈ ${fmtMin(d/25*60+10)} en transporte`:`${fmtKm(d)} · traslado largo`}
function datesDays(t){const a=new Date(t.start+'T12:00:00'),b=new Date(t.end+'T12:00:00');const n=Math.round((b-a)/864e5)+1;return n>0?Math.min(30,n):1}
function tripDays(t){return Math.max(1,t.days||(t.start&&t.end?datesDays(t):1))}
function pathLen(arr){let s=0;for(let i=1;i<arr.length;i++)s+=km([arr[i-1].lat,arr[i-1].lon],[arr[i].lat,arr[i].lon]);return s}
function optimizeTrip(t){
  const its=t.items.filter(i=>S.byId.has(i.o));if(its.length<3)return;
  const P=its.map(i=>S.byId.get(i.o)),n=P.length,D=P.map(a=>P.map(b=>km([a.lat,a.lon],[b.lat,b.lon])));
  // nearest neighbour from the first stop, then 2-opt on an open path
  let ord=[0],left=new Set(P.map((_,i)=>i).slice(1));
  while(left.size){const c=ord[ord.length-1];let best=null;for(const j of left)if(best===null||D[c][j]<D[c][best])best=j;ord.push(best);left.delete(best)}
  let improved=true,guard=0;
  while(improved&&guard++<200){improved=false;
    for(let i=1;i<n-1;i++)for(let k=i+1;k<n;k++){

  const res=ord.map(i=>its[i]);
  const N=Math.min(tripDays(t),res.length);
  if(N>1){
    const L=[];for(let i=1;i<res.length;i++)L.push(D[ord[i-1]][ord[i]]);
    const avg=res.length/N,lam=(L.reduce((a,b)=>a+b,0)/L.length||1)*0.8;

    for(let g=1;g<=N;g++)for(let j=g;j<=m;j++)for(let i=g-1;i<j;i++){if(F[g-1][i]===-Infinity)continue;
      const v=F[g-1][i]+(i>0?L[i-1]:0)-lam*Math.pow((j-i)-avg,2);if(v>F[g][j]){F[g][j]=v;B[g][j]=i}}

}
function gmapsLinks(list,label){

  const chunks=[];for(let i=0;i<pts.length-1;i+=10)chunks.push(pts.slice(i,Math.min(i+11,pts.length)));
  return chunks.map((c,k)=>{const u=`https://www.google.com/maps/dir/?api=1&origin=${c[0]}&destination=${c[c.length-1]}${c.length>2?'&waypoints='+encodeURIComponent(c.slice(1,-1).join('|')):''}&travelmode=${walk?'walking':'transit'}`;

let remoteRef=null,applyingRemote=false;
async function initSync(){
  if(!window.claude?.use)return;

    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return; const id=await user.id(); if(!id)return;
    db.doc('noticias/actual').onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&Array.isArray(d.items)){loadNews().then(n=>{if(!n||(d.updated||'')>(n.updated||'')){NEWS=Promise.resolve(Object.assign({},n||{},d,{revistas:(d.revistas&&d.revistas.length)?d.revistas:(n&&n.revistas),estudios:(d.estudios&&d.estudios.length)?d.estudios:(n&&n.estudios),premios:(d.premios&&d.premios.length)?d.premios:(n&&n.premios)}));if(S.tab==='news')renderNews()}})}},()=>{});
    remoteRef=db.doc('data/users/'+id+'/viajes');
    remoteRef.onSnapshot(snap=>{
      S.sync='cloud';
      const d=snap.exists?snap.data():null;
      if(d&&Array.isArray(d.trips)&&(d.updated||0)>S.updated){applyingRemote=true;S.trips=d.trips;S.extra=Array.isArray(d.extra)?d.extra:[];S.updated=d.updated||0;persistLocal();applyingRemote=false;syncExtra();renderTrips();if(S.tab==='news')renderNews();}

}

  return {id:hid(it.url),n:b.n,alt:b.alt||'',arq:b.arq||'',y0:b.y0??null,y1:b.y1??b.y0??null,prom:b.prom||'',uso:b.uso||'cul',usoO:b.usoO||'',tipo:b.tipo||'',est:b.est||'Contemporáneo',
    vis:b.vis||'ext',cur:[it.txt].concat(b.cur||[]),dud:b.dud||'',lat:b.lat??it.lat,lon:b.lon??it.lon,city:b.city||'',country:b.country||'',approx:!!b.approx,eu:true,mine:false,news:true,
    nurl:it.url,nsrc:it.src||'',saved:new Date().toISOString().slice(0,10),
    gm:`https://www.google.com/maps/search/?api=1&query=${q}`,img:`https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(b.n)}&title=Special:MediaSearch&type=image`,wiki:`https://es.wikipedia.org/w/index.php?search=${q}`}}
function addObra(o){o._t=norm([o.n,o.alt,o.arq,o.city,o.country,o.est,o.tipo,o.prom,(o.cur||[]).join(' ')].join(' '));S.obras.push(o);S.byId.set(o.id,o);
  const m=L.marker([o.lat,o.lon],{icon:makeIcon(o,false),title:o.n,keyboard:false});m.on('click',()=>select(o.id,false));S.markers.set(o.id,m)}
function syncExtra(quiet){
  const want=new Set(S.extra.map(o=>o.id));
  for(const o of [...S.obras])if(o.news&&!want.has(o.id)){S.obras.splice(S.obras.indexOf(o),1);S.byId.delete(o.id);S.markers.delete(o.id);if(S.sel===o.id)closeCard()}
  for(const o of S.extra)if(!S.byId.has(o.id))addObra(Object.assign({},o));
  if(!quiet)apply();
}
function saveNews(it){if(it.obra.ref&&S.byId.has(it.obra.ref))return it.obra.ref;const o=newsObra(it);if(!S.extra.some(x=>x.id===o.id))S.extra.push(o);touch();syncExtra();return o.id}
function unsaveNews(id){S.extra=S.extra.filter(o=>o.id!==id);for(const t of S.trips)t.items=t.items.filter(i=>i.o!==id);touch();closeCard();syncExtra();if(S.tab==='news')renderNews();toast('Quitada de tu mapa')}

/* ---------- boot ---------- */
load();
Promise.all([fetch('data/obras.json').then(r=>r.json()),fetch('data/basemap.json').then(r=>r.json())]).then(([obras,bm])=>{
  S.obras=obras;
  for(const o of obras){o.cur=o.cur||[];o._t=norm([o.n,o.alt,o.arq,o.city,o.country,o.est,o.tipo,o.prom,o.cur.join(' '),(o.tec||[]).join(' '),(o.prob||[]).join(' '),o.nota].join(' '));S.byId.set(o.id,o);}
  initMap(bm);
  for(const o of obras){const m=L.marker([o.lat,o.lon],{icon:makeIcon(o,false),title:o.n,keyboard:false});m.on('click',()=>select(o.id,false));S.markers.set(o.id,m)}
  syncExtra(true);
  $('#loading').remove();
  openTab(innerWidth>=900?'filters':'map');
  apply(false);
  initSync();
  maybeAviso();
}).catch(err=>{$('#loading').innerHTML='<div><b>No se pudo cargar el catálogo</b><span>Recarga la página. Si sigue fallando, revisa tu conexión.</span></div>'});
})();
</script>
